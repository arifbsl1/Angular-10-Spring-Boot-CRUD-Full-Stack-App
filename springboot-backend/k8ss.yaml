apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: springboot-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: 506807812764.dkr.ecr.us-east-1.amazonaws.com/arifemployeemanagement:latest  # Replace with your Spring Boot Docker image
          ports:
            - containerPort: 8080
---

apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 80         # Port that the service will expose internally
      targetPort: 8080  # Port on which the Spring Boot application is running
  type: LoadBalancer