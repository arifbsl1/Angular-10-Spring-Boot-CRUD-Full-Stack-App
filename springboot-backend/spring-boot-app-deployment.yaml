apiVersion: apps/v1
kind: Deployment
metadata:
  name: arifemployeemanagement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arifemployeemanagement
  template:
    metadata:
      labels:
        app: arifemployeemanagement
    spec:
      containers:
      - name: spring-boot-app
        image: 	  506807812764.dkr.ecr.us-east-1.amazonaws.com/arifemployeemanagement:latest
        env:
          - name: DB_HOST
            value: mysql-service
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: arifemployeemanagement-service
spec:
  type: LoadBalancer
  ports:
   - port: 8080
     targetPort: 8080
  selector:
    app: arifemployeemanagement	