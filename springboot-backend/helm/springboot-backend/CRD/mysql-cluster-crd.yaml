apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mysqlclusters.mysql.oracle.com
spec:
  group: mysql.oracle.com
  names:
    kind: MySQLCluster
    plural: mysqlclusters
    singular: mysqlcluster
    shortNames:
      - mysql
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  description: The number of MySQL replicas
                mysqlRootPassword:
                  type: string
                  description: The root password for MySQL
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: The phase of the MySQL cluster (e.g., "Running")
