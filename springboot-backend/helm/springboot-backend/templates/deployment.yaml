---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "springboot-backend.fullname" . }}
  labels:
    app: {{ include "springboot-backend.fullname" . }}
    app.kubernetes.io/name: {{ include "springboot-backend.name" . }}
    helm.sh/chart: {{ include "springboot-backend.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "springboot-backend.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "springboot-backend.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
 
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: springboot-backend-mysql
          ports:
            - name: http
              containerPort: 8080
      tolerations:
            - key: "key1"
              operator: "Exists"
              effect: "NoSchedule"