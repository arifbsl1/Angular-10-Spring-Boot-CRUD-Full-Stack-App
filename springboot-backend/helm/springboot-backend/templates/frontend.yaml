apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      containers:
      - name: frontend
        image: dockeridarif3/angular-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: http://{{ .Release.Name }}-backend:8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: {{ .Release.Name }}-frontend
